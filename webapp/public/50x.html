<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- Сама пробует снова раз в полминуты: служба обычно поднимается за
     несколько секунд, и человек вернётся на доску без лишних нажатий. -->
<meta http-equiv="refresh" content="30">
<title>Доска Пи временно недоступна</title>
<link rel="icon" href="/favicon.ico">
<style>
  /* Всё внутри файла: эту страницу nginx отдаёт, когда служба доски не
     отвечает, и рассчитывать на что-то ещё с сервера здесь нельзя. Цвета —
     те же, что у сайта (schoolpi-theme.css). */
  :root {
    --bg: #F4EFE6; --surface: #FFFCF6; --line: #E0D8C9;
    --text: #2A211C; --muted: #5E5148; --accent: #7A2E1E; --on-accent: #fff;
    --header: #4A2018;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1B1512; --surface: #26201C; --line: #3A312B;
      --text: #F2E9DF; --muted: #B5A597; --accent: #E0896F; --on-accent: #1B1512;
      --header: #2A1A14;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: flex; flex-direction: column; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  header {
    padding: 14px 16px; background: var(--header); color: #F7F0E8;
    font-weight: 800; font-size: 1.4rem;
  }
  main { flex: 1; display: grid; place-items: center; padding: 24px 16px; }
  .card {
    width: 100%; max-width: 520px; padding: 32px 24px; text-align: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  }
  h1 { margin: 0 0 12px; font-size: 1.5rem; }
  p { margin: 0 0 20px; color: var(--muted); }
  button {
    padding: 10px 20px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 700;
  }
</style>
</head>
<body>
  <header>Доска π</header>
  <main>
    <div class="card">
      <h1>Доска временно недоступна</h1>
      <p>
        Скорее всего, мы как раз обновляем сайт — это занимает меньше минуты.
        Нарисованное на досках не пропало. Страница сама попробует снова через полминуты.
      </p>
      <button type="button" onclick="location.reload()">Попробовать сейчас</button>
    </div>
  </main>
</body>
</html>
