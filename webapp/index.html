<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Масштаб страницы отключён намеренно: у холста свой зум, и жест
         двумя пальцами должен приближать рисунок, а не интерфейс.
         Заодно iOS перестаёт подтягивать страницу при вводе текста. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Доска для совместной работы в браузере: откройте доску, дайте ссылку — и работайте вместе, на одном холсте." />
    <title>SchoolPiBoard — доска для совместной работы</title>

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <!-- Яндекс.Вебмастер отдельно просит либо SVG, либо ровно 120×120 —
         векторной версии значка нет, поэтому даём растровую нужного размера. -->
    <link rel="icon" type="image/png" sizes="120x120" href="/favicon-120x120.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#7A2E1E" />

    <!--
      Тема ставится здесь, а не в React: пока приложение загружается, между
      показом страницы и запуском кода успевает мелькнуть светлый фон.
      На тёмной теме это заметно и раздражает.

      Светлая по умолчанию, системную настройку не слушаем — так же, как
      основной сайт.
    -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark' || saved === 'light') { theme = saved; }
        } catch (e) { /* в приватном режиме localStorage недоступен */ }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
