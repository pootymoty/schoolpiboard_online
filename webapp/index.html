<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Доска для занятий в браузере: откройте доску, дайте ссылку — и разбирайте задачи вместе, на одном холсте." />
    <title>SchoolPiBoard — доска для занятий</title>

    <!--
      Тема ставится здесь, а не в React: пока приложение загружается, между
      показом страницы и запуском кода успевает мелькнуть светлый фон.
      На тёмной теме это заметно и раздражает.

      Светлая по умолчанию, системную настройку не слушаем — так же, как
      основной сайт.
    -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark' || saved === 'light') { theme = saved; }
        } catch (e) { /* в приватном режиме localStorage недоступен */ }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
