# Сборка доски на стороне GitHub.
#
# Сервер, на котором служба работает, остаётся чистым: только рантайм
# ASP.NET Core, PostgreSQL, Redis и nginx — ни SDK, ни Node.js, ни исходников,
# ни git. Здесь собирается готовый архив с api/ и web/, который на сервере
# остаётся только распаковать.
name: online-board

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - 'webapp/**'
      - '.github/workflows/online-board.yml'

permissions:
  contents: write

env:
  PROJECT: server/SchoolPiBoard.Web/SchoolPiBoard.Web.csproj

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 8.*

      # Миграции пишутся вручную: у среды, где готовятся правки, нет доступа
      # к пакетам .NET, а значит и к `dotnet ef migrations add`. Эта проверка
      # закрывает возникающий риск: если модель и миграции разошлись, сборка
      # падает здесь, а не база расходится со схемой в бою.
      - name: Check migrations match the model
        run: dotnet ef migrations has-pending-model-changes --project ${{ env.PROJECT }}

      - name: Publish API
        run: dotnet publish ${{ env.PROJECT }} -c Release -o pack/api

      # Самодостаточный исполняемый файл, применяющий миграции. Нужен потому,
      # что задание требует применять их командой при выкладке, а SDK на
      # сервере нет и быть не должно.
      - name: Build migration bundle
        run: >
          dotnet ef migrations bundle --project ${{ env.PROJECT }}
          --self-contained -r linux-x64 --force -o pack/api/migrate

      - name: Build web
        working-directory: webapp
        env:
          VITE_API_URL: /api
          # Ключ сайта SmartCaptcha вшивается в бандл при сборке, а не читается
          # на сервере: задать его через .env постфактум нельзя. Он не секрет —
          # виден в исходниках страницы, — поэтому лежит в переменной
          # репозитория, а не в секретах.
          VITE_CAPTCHA_SITEKEY: ${{ vars.VITE_CAPTCHA_SITEKEY }}
        run: |
          npm ci
          npm run build

      - name: Pack
        run: |
          mkdir -p pack/web
          cp -r webapp/dist/. pack/web/
          tar -czf online-board.tar.gz -C pack .

      # Готовый архив кладём в релиз: по такой ссылке его можно забрать
      # обычным curl, без токенов и без установки чего-либо на сервер.
      # Внутри уже разложено на api/ и web/ — распаковывать прямо в
      # /var/www/schoolpiboard.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete online-board-latest --yes --cleanup-tag || true
          gh release create online-board-latest online-board.tar.gz \
            --title "Онлайн-доска — последняя сборка" \
            --notes "Собрано из ${{ github.sha }}. Распаковывается в /var/www/schoolpiboard." \
            --prerelease
