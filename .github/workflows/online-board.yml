# Сборка доски на стороне GitHub.
#
# Сервер, на котором служба работает, остаётся чистым: только рантайм
# ASP.NET Core, PostgreSQL, Redis и nginx — ни SDK, ни Node.js, ни исходников,
# ни git. Здесь собирается готовый архив с api/ и web/, который на сервере
# остаётся только распаковать.
name: online-board

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - 'webapp/**'
      - '.github/workflows/online-board.yml'

permissions:
  contents: write

env:
  PROJECT: server/SchoolPiBoard.Web/SchoolPiBoard.Web.csproj

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 8.*

      # Сборка отдельным шагом — до всего, что зависит от неё. `dotnet ef`
      # собирает проект сам, но об ошибках говорит одной строкой «Build
      # failed», без единого слова о том, что именно не так. Разбираться
      # приходилось глазами по коду; теперь ошибка компилятора видна в
      # логах там, где ей и место.
      - name: Build
        run: dotnet build ${{ env.PROJECT }} -c Release

      # Миграции пишутся вручную: у среды, где готовятся правки, нет доступа
      # к пакетам .NET, а значит и к `dotnet ef migrations add`. Отсюда две
      # проверки вместо одной.
      #
      # Первая: миграции вообще находятся. Без атрибута [DbContext] миграция
      # не привязана к контексту, и EF её не видит — но не жалуется, а
      # сообщает «база уже актуальна» и создаёт пустую таблицу истории.
      # Схема при этом не создаётся, и узнать об этом можно только по
      # отсутствующим таблицам. Один раз так и вышло.
      - name: Check migrations are discoverable
        run: |
          dotnet ef migrations list --project ${{ env.PROJECT }} --no-connect \
            | tee /tmp/migrations.txt
          grep -qE '^[0-9]{14}_' /tmp/migrations.txt

      # Вторая: модель и миграции описывают одну и ту же схему.
      - name: Check migrations match the model
        run: dotnet ef migrations has-pending-model-changes --project ${{ env.PROJECT }}

      - name: Publish API
        run: dotnet publish ${{ env.PROJECT }} -c Release -o pack/api

      # Исполняемый файл, применяющий миграции: задание требует применять их
      # командой при выкладке, а SDK на сервере нет и быть не должно.
      #
      # Без --self-contained: рантайм ASP.NET Core на сервере уже стоит ради
      # самой службы, и вторая его копия раздувала бы каждое обновление
      # со считанных мегабайт до шестидесяти с лишним.
      - name: Build migration bundle
        run: >
          dotnet ef migrations bundle --project ${{ env.PROJECT }}
          -r linux-x64 --force -o pack/api/migrate

      - name: Build web
        working-directory: webapp
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      - name: Pack
        run: |
          mkdir -p pack/web
          cp -r webapp/dist/. pack/web/
          tar -czf online-board.tar.gz -C pack .

      # Готовый архив кладём в релиз: по такой ссылке его можно забрать
      # обычным curl, без токенов и без установки чего-либо на сервер.
      # Внутри уже разложено на api/ и web/ — распаковывать прямо в
      # /var/www/schoolpiboard.
      #
      # Релиз обновляется, а не пересоздаётся. Прежний вариант удалял его
      # вместе с тегом и создавал заново — и время от времени `create` не
      # успевал за удалением тега, молча сваливаясь в черновик. Черновик
      # публично ассетов не отдаёт, поэтому сборка была зелёной, а ссылка
      # на сервере отвечала 404.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: "Собрано из ${{ github.sha }}. Распаковывается в /var/www/schoolpiboard."
        run: |
          set -euo pipefail

          # Подчищаем черновики, оставшиеся от прежней схемы публикации:
          # они занимают имя и сбивают с толку при разборе.
          gh api "repos/${{ github.repository }}/releases" \
            --jq '.[] | select(.draft and .tag_name == "online-board-latest") | .id' \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/releases/{}"

          if gh release view online-board-latest >/dev/null 2>&1; then
            gh release edit online-board-latest --notes "$NOTES" --prerelease
          else
            gh release create online-board-latest \
              --title "Онлайн-доска — последняя сборка" \
              --notes "$NOTES" \
              --prerelease \
              --target "${{ github.sha }}"
          fi

          # --clobber заменяет файл, если он уже приложен к релизу.
          gh release upload online-board-latest online-board.tar.gz --clobber

          # Проверяем, что ассет действительно доступен: молчаливая потеря
          # архива один раз уже стоила разбирательства.
          gh release view online-board-latest --json assets \
            --jq '.assets[] | select(.name == "online-board.tar.gz") | .size' \
            | grep -qE '^[0-9]+$'
