# nginx для board.school-pi.online.
# Ставится в /etc/nginx/sites-available/schoolpiboard и включается ссылкой
# в sites-enabled.
#
# Конфиг основного сайта этот файл не трогает: nginx разводит запросы по
# server_name, и school-pi.online продолжает обслуживать gunicorn.
#
# Здесь только HTTP. Блок с сертификатом дописывает certbot — если вписать
# ssl_certificate до выпуска сертификата, nginx не перезапустится, потому
# что файла ещё не существует.

server {
    listen 80;
    server_name board.school-pi.online;

    root /var/www/schoolpiboard/web;
    index index.html;

    # Клиент одностраничный: любой адрес отдаём index.html, маршрутизацией
    # занимается сам клиент. Без этого внутренние адреса отдавали бы 404
    # при перезагрузке страницы.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML кешировать нельзя. Внутри — имена файлов сборки с хешами;
    # закешированная страница продолжает ссылаться на старые файлы, и
    # обновление не доезжает до браузера, хотя на сервере уже новое.
    #
    # Правило по расширению, а не только для /index.html: продающие
    # страницы собираются в отдельные файлы (/faq/index.html и прочие),
    # чтобы поисковик видел текст, а не пустой div.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires off;
    }

    # Собранные Vite файлы содержат хеш в имени, поэтому их можно кешировать
    # надолго: при изменении меняется имя, а не содержимое по старому адресу.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5081/api/;
        proxy_http_version 1.1;

        # Загрузка файлов в библиотеку: предел на файл — 25 МБ, с запасом
        # на служебную обвязку формы. По умолчанию nginx рвёт всё, что
        # больше мегабайта, и это выглядит как «сервер молча не принял».
        client_max_body_size 30m;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Доска работает по веб-сокетам. Без Upgrade и Connection соединение
    # не поднимется, и SignalR молча свалится на длинный опрос — доска
    # будет «работать», но с задержками, и причину искать долго.
    #
    # Более длинный префикс выигрывает у /api/ по правилам nginx, поэтому
    # порядок блоков значения не имеет.
    location /api/hub/ {
        proxy_pass http://127.0.0.1:5081/api/hub/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Раздел 10.2 требует не меньше часа: занятие идёт дольше, чем
        # стандартный таймаут в минуту, и соединение рвалось бы посреди урока.
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
