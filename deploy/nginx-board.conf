# nginx для board.school-pi.online.
# Ставится в /etc/nginx/sites-available/schoolpiboard и включается ссылкой
# в sites-enabled.
#
# Конфиг основного сайта этот файл не трогает: nginx разводит запросы по
# server_name, и school-pi.online продолжает обслуживать gunicorn.
#
# Блок HTTPS и второй server (редирект с 80 на 443) дописывает и держит
# certbot сам — здесь только то, что правит человек. Слепая перезапись
# всего файла с этой заготовкой стёрла бы блок с сертификатом; правку
# нужно вносить в уже стоящий на сервере файл, не поверх него.

server {
    server_name board.school-pi.online;

    root /var/www/schoolpiboard/web;
    index index.html;

    # Имя файла сборки несёт отпечаток содержимого: меняется содержимое —
    # меняется имя. Такое можно кешировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Страницы наоборот: адрес постоянный, содержимое меняется с каждой
    # выкладкой, поэтому браузер обязан спрашивать.
    #
    # Статус остаётся настоящим 404 для того, что не нашлось файлом: раньше
    # try_files сразу подставлял index.html и отдавал 200 на любой адрес,
    # даже вымышленный, — Яндекс.Вебмастер отметил это как ошибку. Тело
    # ответа всё равно index.html — клиент сам разберёт адрес и откроет
    # нужный раздел или уйдёт на главную, — но поисковик теперь увидит на
    # выдуманном адресе именно 404, а не подтверждение, что там есть страница.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires off;
    }

    location /api/ {
        client_max_body_size 30m;
        proxy_pass http://127.0.0.1:5081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Доска работает по веб-сокетам. Без Upgrade и Connection соединение
    # не поднимется, и SignalR молча свалится на длинный опрос — доска
    # будет «работать», но с задержками, и причину искать долго.
    location /api/hub/ {
        proxy_pass http://127.0.0.1:5081/api/hub/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Занятие идёт дольше, чем стандартный таймаут в минуту, и
        # соединение рвалось бы посреди урока.
        proxy_read_timeout 1h;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/board.school-pi.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/board.school-pi.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = board.school-pi.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name board.school-pi.online;
    return 404; # managed by Certbot


}
